name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Avoid concurrent releases for the same tag clobbering each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app (macOS)
        if: matrix.os == 'macos-latest'
        env:
          # Ad-hoc signing path: package.json -> build.mac.identity = "-"
          # tells electron-builder to use codesign's ad-hoc identity
          # (free, self-applied, no Apple Developer cert needed). The
          # resulting DMG opens with the friendly "unidentified
          # developer" dialog instead of the harsher "damaged" message.
          # When a real Developer ID cert is wired up, add CSC_LINK +
          # CSC_KEY_PASSWORD secrets and replace identity with the
          # full team name; also re-enable hardenedRuntime.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run build:mac

      - name: Build app (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm run build:win

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: dist-release/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist-release/

      - name: List downloaded files
        run: ls -la dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.dmg
            dist-release/*.exe
            dist-release/*.blockmap
            dist-release/latest-mac.yml
            dist-release/latest.yml
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            See [RELEASES.md](https://github.com/psiddharthdesign/hypermotion/blob/main/RELEASES.md) for the full release notes.

            ## Install on macOS

            1. Download `hyper-motion-*-arm64.dmg` (Apple Silicon) or `hyper-motion-*.dmg` (Intel).
            2. Open the DMG and drag **hyper-motion** to **Applications**.
            3. **One-time setup** — open Terminal and run:
               ```sh
               xattr -cr /Applications/hyper-motion.app
               ```
            4. Open **hyper-motion** from Applications.

            **Why step 3?** hyper-motion v0.1.x ships unsigned. macOS Sequoia/Sonoma flag
            unsigned apps from the internet as "damaged" unless you remove the quarantine
            attribute, which is what `xattr -cr` does. Apple Developer signing (which
            removes this step entirely) is on the v0.2 roadmap.

            ## Install on Windows

            Download `hyper-motion Setup *.exe` and run it. Windows SmartScreen will warn
            you — click **"More info"** → **"Run anyway"**. The v0.1.x series is unsigned
            on Windows too.

            ---

            Both builds are unsigned for the v0.1.x research-preview series. If you'd like
            to skip these install warnings, you can also [build from source](https://github.com/psiddharthdesign/hypermotion#build-from-source).
