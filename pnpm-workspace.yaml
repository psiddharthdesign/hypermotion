packages:
  - .
  - cli
  - figma-plugin

# Advisory patches for transitive dependencies whose direct parents have
# not released an update yet. Ranges stay within the parent's declared
# major so resolution never has to fork the tree.
overrides:
  tar: ">=7.5.21"
  tmp: ">=0.2.6"
  postcss: ">=8.5.18"
  form-data: ">=4.0.6"
  js-yaml: ">=4.3.0"
  fast-uri: ">=3.1.4"
  "@hono/node-server": ">=2.0.5"

allowBuilds:
  electron: true
  electron-builder: true
  esbuild: true
